[package]
name = "minigrep"
version = "0.2.0"
edition = "2021"
authors = ["Moonlight1210-h"]
description = "A minigrep CLI tool inspired by the classic grep, implemented in Rust."
license = "MIT"
repository = "https://github.com/Moonlight1210-h/minigrep"
readme = "README.md"

[dependencies]
# Regex-based search engine (used for pattern matching)
regex = "1"

# Command-line parser
clap = { version = "4", features = ["derive"] }

# Colorized output for matched patterns
colored = "2"

[dev-dependencies]
# Integration testing helpers
assert_cmd = "2"
predicates = "2"
tempfile = "3"
