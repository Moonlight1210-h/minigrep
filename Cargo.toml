[package]
name = "minigrep"
version = "0.1.2"
edition = "2024"
authors = ["Moonlight <qwex1210@gmail.com>"]
description = "A minimal grep-like CLI tool written in Rust."
repository = "https://github.com/Moonlight1210-h/minigrep"
license = "MIT"
keywords = ["grep", "cli", "search", "rust"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
regex = "1.13.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
